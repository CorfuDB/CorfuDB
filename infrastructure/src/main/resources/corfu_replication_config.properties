log_reader_max_retry=5
log_reader_queue_size=5
log_reader_resend_timer=100
log_reader_error_on_message_timeout=true

log_writer_queue_size=20
log_writer_ack_cycle_count=2
log_writer_ack_cycle_time=100

# Snapshot lease policy of the sink. The sink decides whether a snapshot sync may start, how long it
# may keep the checkpointer frozen, and what must happen before the next one is admitted.
# These are starting values: size the total budget for the largest snapshot the deployment carries,
# using the logreplication.snapshot.lease.* metrics.
#
# Total budget of one attempt (preparation, transfer, apply and apply retries). Nothing renews it.
snapshot_lifecycle_max_duration_ms=5400000
# Minimum time protection stays released before the next snapshot may be admitted.
snapshot_lifecycle_min_recovery_ms=60000
# How long cleanup or recovery may take before SNAPSHOT_RECOVERY_BLOCKED is raised.
snapshot_lifecycle_recovery_alarm_ms=1800000
# How long an admitted attempt may go without accepted snapshot traffic before it is abandoned
# (the source crashed or failed over). Zero or less disables it; the total budget still applies.
snapshot_lifecycle_transfer_idle_ms=300000
# Retries of a transiently failing apply, all inside the same budget.
snapshot_lifecycle_max_apply_retries=10

